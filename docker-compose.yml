services:
  api:
    build: .
#    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Позволит видеть FastAPI на хосте под этим именем
    volumes:
      - .:/app
    container_name: fast_app
    ports:
      - "8000:8000"
    restart: always
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./forfastapi.sqlite
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis_broker
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    container_name: celery_worker
    command: celery -A app.config.celery_app worker --loglevel=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - api
  flower:
    image: mher/flower
    command: celery --broker=redis://redis:6379/0 flower
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      # Подменяем стандартный дефолтный конфиг Nginx нашим собственным
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
